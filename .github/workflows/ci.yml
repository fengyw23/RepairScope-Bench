name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m pip install ruff
      - run: ruff check src scripts tests
      - run: python scripts/build_v06.py
      - run: repairscope validate data/v06
      - run: repairscope run-baselines data/v06
      - run: python scripts/build_pilot.py
      - run: python scripts/build_challenge.py
      - run: repairscope validate data/legacy/v0.5/pilot
      - run: repairscope validate data/legacy/v0.5/challenge
      - run: python -m unittest discover -s tests -v
