[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repairscope-bench"
version = "1.1.0"
description = "A controlled benchmark for post-commit agent recovery from standardized failure states."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "RepairScope-Bench contributors" }
]
keywords = ["ai-agents", "benchmark", "tool-use", "failure-recovery", "rollback"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "state-bench @ git+https://github.com/microsoft/STATE-Bench.git@4efcbf2d4fe60df04878859b692d9391f3d5b33a",
]

[project.scripts]
repairscope = "repairscope_bench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
